name: Build Android

# Builds the Android install file on a public repository, because Actions minutes are billed on
# a private one. The code is checked out at run time and nothing is committed back.
#
# The APK is signed with the sideloading key that lives in the private repository, so a later
# build installs over an earlier one and keeps the player's worlds. It is not a Play Store key:
# installing is "allow installs from this source" on the phone, nothing more.

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android.yml"

env:
  CODE_REPO: Programmer7-dev/CraftedResistanceCode

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout the game code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner has the SDK already; the only thing missing is the licence acceptance, which
      # is what the SDK packages refuse to install without.
      - name: Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # The desktop loads the 100+ MB of source art and shrinks it at start-up. A phone should
      # not carry that, so the same files are shrunk here into the app's assets.
      - name: Shrink the artwork to tile size
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow
          .venv/bin/python tools/shrink_textures.py \
            src/main/resources/Images android/app/build/mobile-assets/Images

      - name: Build the APK
        working-directory: android
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease

      - name: Upload the install file
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # A build that compiles is not the same as a game that runs. This boots an emulator,
      # installs the APK, starts it the way a launcher would, and photographs what came up.
      - name: Run it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          script: |
            set -x
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.craftedresistance.game/com.craftedresistance.android.MainActivity
            sleep 45
            adb exec-out screencap -p > android-screenshot.png
            echo "--- crashes, if any ---"
            adb logcat -d -s AndroidRuntime:E | tail -60

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot
          path: android-screenshot.png
          if-no-files-found: warn
