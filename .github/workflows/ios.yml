name: Build iOS

# The iOS app is built here, on a public repository, because Actions minutes are billed on
# a private one. The code is checked out at run time and nothing is committed back.
#
# This produces two things every run:
#   - a screenshot of the app actually running in the simulator, which is the only way to
#     see the render from a machine that is not a Mac
#   - an unsigned .ipa, which is the install file. It has to be signed with the user's own
#     Apple ID (Sideloadly, AltStore) or Xcode before an iPhone will run it. There is no
#     paid developer certificate in this repository, so it cannot be signed here.

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios.yml"

env:
  CODE_REPO: Programmer7-dev/CraftedResistanceCode

jobs:
  ios:
    name: iOS app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout the game code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}

      - name: Install XcodeGen and Pillow
        run: |
          brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow

      - name: Shrink the artwork to tile size
        run: .venv/bin/python tools/shrink_textures.py src/main/resources/Images ios/Assets/Images

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project CraftedResistance.xcodeproj \
            -scheme CraftedResistance \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run it in the simulator and take a screenshot
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.craftedresistance.game
          sleep 10
          xcrun simctl io "$DEVICE" screenshot screenshot.png
          # the device is held in portrait and the app draws landscape, so turn the picture
          # upright to look at it
          sips -r 270 screenshot.png >/dev/null
          ls -l screenshot.png

      - name: Upload the screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot
          path: ios/screenshot.png
          if-no-files-found: error

      - name: Build the install file
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project CraftedResistance.xcodeproj \
            -scheme CraftedResistance \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          rm -rf Payload CraftedResistance-unsigned.ipa
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/CraftedResistance.app Payload/
          zip -qr CraftedResistance-unsigned.ipa Payload
          ls -lh CraftedResistance-unsigned.ipa

      - name: Upload the install file
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/CraftedResistance-unsigned.ipa
          if-no-files-found: error
